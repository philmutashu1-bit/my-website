<!DOCTYPE html>
<html>
<head>
<title>Contact - O Level Study Hub</title>

<style>

*{
    box-sizing: border-box;
}

body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.container{
    background:white;
    width:420px;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}


h1{
    text-align:center;
    color:#667eea;
    margin-bottom:5px;
}


p{
    text-align:center;
    color:#555;
}


.contact-info{
    background:#f4f6ff;
    padding:15px;
    border-radius:12px;
    margin:20px 0;
    text-align:center;
}


input, textarea{

    width:100%;
    padding:13px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}


textarea{
    height:120px;
    resize:none;
}


button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}


button:hover{

    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(102,126,234,0.5);

}


.back{

    display:block;
    text-align:center;
    margin-top:20px;
    color:#667eea;
    text-decoration:none;
    font-weight:bold;
}


.logo{

    text-align:center;
    font-size:45px;
}


</style>

</head>


<body>


<div class="container">


<div class="logo">📚</div>

<h1>O Level Study Hub</h1>

<p>Need help with notes, past papers or projects?</p>


<div class="contact-info">

📧 Email: olevelstudyhub@gmail.com<br><br>

📖 Subjects: Maths | Science | Computers | Business

</div>



<form action="https://api.web3forms.com/submit" method="POST">


<input type="hidden" 
name="access_key" 
value="a2d155e8-b9ef-43cb-abfc-7348590f3dc4">



<input 
type="text" 
name="name" 
placeholder="Your Name" 
required>



<input 
type="email" 
name="email" 
placeholder="Your Email" 
required>



<textarea 
name="message" 
placeholder="Write your message here..." 
required>
</textarea>



<button type="submit">

Send Message 🚀

</button>


</form>


<a class="back" href="index.html">

⬅ Back To Home

</a>


</div>


</body>
</html>
